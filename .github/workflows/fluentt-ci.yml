name: fluentt ci

on:
  push:
    branches: [fluentt/main]
  pull_request:
    branches: [fluentt/main]
  workflow_dispatch: {}

jobs:
  packaging:
    name: wheel packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist/

      - name: Verify agent.transports is packaged
        run: |
          cd dist
          python -m zipfile -l hermes_agent-*.whl | grep 'agent/transports/__init__\.py' || {
            echo "::error::agent/transports/__init__.py missing from wheel — packaging regression"
            exit 1
          }
          python -m zipfile -l hermes_agent-*.whl | grep 'agent/transports/codex\.py' || {
            echo "::error::agent/transports/codex.py missing from wheel"
            exit 1
          }

      - name: Install wheel and smoke import
        run: |
          pip install dist/hermes_agent-*.whl
          python -c "from agent.transports import get_transport; print('transports OK')"
          python -c "import hermes_agent, hermes_cli, agent; print('core imports OK')"
